name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          # Matches the toolchain pin in ci.yml — see comment there.
          swift-version: '6.2.3'

      - name: Build macOS release binary
        working-directory: mac
        run: swift build -c release

      - name: Package macOS binary
        working-directory: mac
        run: |
          mkdir -p dist
          cp .build/release/Talkies dist/
          cd dist
          tar -czf Talkies-macOS-${{ github.ref_name }}.tar.gz Talkies

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: mac/dist/Talkies-macOS-${{ github.ref_name }}.tar.gz
          retention-days: 1

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: windows/Talkies.Windows
        run: dotnet restore

      - name: Build Windows release binary
        working-directory: windows/Talkies.Windows
        run: dotnet publish -c Release -r win-x64 --self-contained true -o dist

      - name: Package Windows binary
        working-directory: windows/Talkies.Windows
        run: |
          Compress-Archive -Path dist\* -DestinationPath Talkies-Windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: windows/Talkies.Windows/Talkies-Windows-${{ github.ref_name }}.zip
          retention-days: 1

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Track Zig master intentionally — see matching comment in ci.yml.
          version: master

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libpulse-dev \
            libsqlite3-dev \
            libx11-dev \
            libdbus-1-dev \
            libgtk-4-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libharfbuzz-dev

      - name: Workaround Ubuntu multiarch include paths
        # See matching step in ci.yml: linux/build.zig hardcodes
        # /usr/lib64/<pkg>/include paths that only exist on Gentoo/Fedora.
        run: sudo ln -sf "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" /usr/lib64

      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          make
          # See matching comment in ci.yml: whisper.cpp's shared libs now
          # land under build/, not the repo root, and depend on multiple
          # libggml*.so backend libs — install whatever it actually built.
          sudo find build -name 'lib*.so*' -exec cp -P {} /usr/local/lib/ \;
          sudo find . -name '*.h' -path '*/include/*' -exec cp {} /usr/local/include/ \;
          sudo ldconfig

      - name: Build Linux release binary
        working-directory: linux
        run: zig build -Doptimize=ReleaseFast

      - name: Package Linux binary
        working-directory: linux
        run: |
          mkdir -p dist/talkies-linux
          cp zig-out/bin/talkies dist/talkies-linux/
          cp talkies-overlay-gtk dist/talkies-linux/
          cd dist/talkies-linux
          tar -czf ../Talkies-Linux-${{ github.ref_name }}.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: linux/dist/Talkies-Linux-${{ github.ref_name }}.tar.gz
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-release
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-release
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/Talkies-macOS-${{ github.ref_name }}.tar.gz
            artifacts/Talkies-Windows-${{ github.ref_name }}.zip
            artifacts/Talkies-Linux-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
