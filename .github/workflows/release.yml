name: Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'

concurrency:
  group: talkies-release-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_label: ${{ steps.version.outputs.release_label }}
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v7

      - name: Validate and normalize release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_label="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            app_version="${release_label#v}"
            if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be vMAJOR.MINOR.PATCH (for example v1.2.3); got ${release_label}" >&2
              exit 1
            fi
          else
            app_version="$(tr -d '[:space:]' < packaging/shared/version.txt)"
            if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "packaging/shared/version.txt must contain MAJOR.MINOR.PATCH; got ${app_version}" >&2
              exit 1
            fi
            release_label="latest"
          fi
          {
            echo "app_version=${app_version}"
            echo "release_label=${release_label}"
          } >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    needs: resolve-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'

      - name: Run macOS tests
        working-directory: mac
        run: swift test

      # Tags can target commits that did not run branch CI. Exercise the
      # pinned local models and insertion boundary before publishing artifacts.
      - name: Cache verified S1-mini model
        uses: actions/cache@v6
        with:
          path: ~/Library/Application Support/Talkies/Models/S1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          key: macos-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c-3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634

      - name: Download pinned S1-mini and verify CPU cleanup
        working-directory: mac
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
        run: swift test --filter S1MiniCleanerIntegrationTests

      - name: Cache WhisperKit model files
        uses: actions/cache@v6
        with:
          path: ~/Documents/huggingface
          key: ${{ runner.os }}-whisperkit-tiny-${{ hashFiles('mac/Package.resolved') }}

      - name: Provision WhisperKit tiny and verify transcription
        working-directory: mac
        env:
          TALKIES_RUN_WHISPERKIT_MODEL_TESTS: '1'
        run: swift test --filter WhisperKitRecognizerTests/testTranscribesWithCachedModelWithoutResolvingItRemotely

      - name: Verify cached ASR, denied-network S1-mini cleanup, and insertion acceptance
        working-directory: mac
        env:
          TALKIES_RUN_OFFLINE_ACCEPTANCE: '1'
        run: swift test --filter OfflineDictationAcceptanceTests

      - name: Build macOS app bundle and zip
        env:
          VERSION: ${{ needs.resolve-version.outputs.app_version }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: packaging/macos/package-app.sh

      - name: Apply release artifact label
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.app_version }}
          RELEASE_LABEL: ${{ needs.resolve-version.outputs.release_label }}
        run: mv "dist/Talkies-macOS-${APP_VERSION}.zip" "dist/Talkies-macOS-${RELEASE_LABEL}.zip"

      - name: Build and smoke-test macOS DMG installer
        env:
          APP_BUNDLE: ${{ github.workspace }}/dist/Talkies.app
          RELEASE_LABEL: ${{ needs.resolve-version.outputs.release_label }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: packaging/macos/package-dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release
          path: |
            dist/Talkies-macOS-${{ needs.resolve-version.outputs.release_label }}.zip
            dist/Talkies-macOS-${{ needs.resolve-version.outputs.release_label }}.dmg
          retention-days: 1

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    needs: resolve-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet restore Talkies.Windows.Tests.csproj

      - name: Cache verified S1-mini model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          key: windows-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c-3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634

      - name: Cache verified Whisper tiny model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
          key: windows-whisper-tiny-5359861c739e955e79d9a303bcbc70fb988958b1-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21

      - name: Run Windows tests
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Release --no-restore --filter "Category!=ModelIntegration"

      - name: Verify pinned S1-mini cleanup works offline on CPU
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_S1_MINI_MODEL_DIR: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~S1MiniOfflineIntegrationTests" --verbosity normal

      - name: Verify cached Whisper ASR works offline on CPU
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_WHISPER_MODEL_DIR: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~WhisperAsrOfflineIntegrationTests" --verbosity normal

      - name: Verify cached ASR, denied-network S1-mini cleanup, and insertion boundary
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_S1_MINI_MODEL_DIR: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          TALKIES_TEST_WHISPER_MODEL_DIR: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~OfflineDictationAcceptanceTests" --verbosity normal

      - name: Set up verified NSIS compiler
        shell: pwsh
        run: ./packaging/windows/setup-nsis.ps1

      - name: Package and smoke-test Windows release archive
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.app_version }}
          RELEASE_LABEL: ${{ needs.resolve-version.outputs.release_label }}
          OUTPUT_DIRECTORY: ${{ github.workspace }}/dist
        run: ./packaging/windows/package-portable.ps1 -AppVersion "$env:APP_VERSION" -ReleaseLabel "$env:RELEASE_LABEL" -OutputDirectory "$env:OUTPUT_DIRECTORY"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release
          path: |
            dist/Talkies-Windows-${{ needs.resolve-version.outputs.release_label }}.zip
            dist/Talkies-Windows-${{ needs.resolve-version.outputs.release_label }}-Setup.exe
            dist/Talkies-Windows-Whisper-CUDA13-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip
            dist/Talkies-Windows-Whisper-CUDA12-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip
            dist/Talkies-Windows-Whisper-Vulkan-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip
          retention-days: 1

  build-linux:
    name: Linux packages
    needs: resolve-version
    uses: ./.github/workflows/linux-package.yml
    with:
      release_label: ${{ needs.resolve-version.outputs.release_label }}
      app_version: ${{ needs.resolve-version.outputs.app_version }}
      artifact_name: linux-release

  create-release:
    name: Create GitHub Release
    needs: [resolve-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-release
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-release
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: linux-release
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum Talkies-macOS-${{ needs.resolve-version.outputs.release_label }}.zip Talkies-macOS-${{ needs.resolve-version.outputs.release_label }}.dmg Talkies-Windows-${{ needs.resolve-version.outputs.release_label }}-Setup.exe Talkies-Windows-${{ needs.resolve-version.outputs.release_label }}.zip Talkies-Windows-Whisper-CUDA13-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip Talkies-Windows-Whisper-CUDA12-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip Talkies-Windows-Whisper-Vulkan-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.tar.gz Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.deb Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.rpm Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.pkg.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "release=${{ needs.resolve-version.outputs.release_label }}"
            echo "app_version=${{ needs.resolve-version.outputs.app_version }}"
            echo "platforms=macOS,windows-x64,linux-x86_64 (tar.gz, deb, rpm, Arch)"
          } > BUILD-INFO.txt

      - name: Point rolling latest at the tested commit
        if: ${{ github.ref_type != 'tag' }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_label }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Talkies Latest ({0})', github.sha) }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Talkies-macOS-${{ needs.resolve-version.outputs.release_label }}.zip
            artifacts/Talkies-macOS-${{ needs.resolve-version.outputs.release_label }}.dmg
            artifacts/Talkies-Windows-${{ needs.resolve-version.outputs.release_label }}-Setup.exe
            artifacts/Talkies-Windows-${{ needs.resolve-version.outputs.release_label }}.zip
            artifacts/Talkies-Windows-Whisper-CUDA13-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip
            artifacts/Talkies-Windows-Whisper-CUDA12-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip
            artifacts/Talkies-Windows-Whisper-Vulkan-Runtime-${{ needs.resolve-version.outputs.release_label }}.zip
            artifacts/Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.tar.gz
            artifacts/Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.deb
            artifacts/Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.rpm
            artifacts/Talkies-Linux-${{ needs.resolve-version.outputs.release_label }}.pkg.tar.zst
            artifacts/SHA256SUMS
            artifacts/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The AUR PKGBUILD and Gentoo ebuild download the tagged tarball and pin
      # its SHA-256, so they only make sense on versioned releases.
      - name: Attach AUR and Gentoo recipes
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.release_label }}" \
            artifacts/PKGBUILD \
            "artifacts/talkies-bin-${{ needs.resolve-version.outputs.app_version }}.ebuild" \
            --clobber
