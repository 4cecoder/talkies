name: Linux package

# Reusable pipeline: build Talkies for Linux on an old-glibc baseline, run the
# test suite, produce every package format, then install each package on the
# distributions it targets. Called by ci.yml (PRs/master) and release.yml.

on:
  workflow_call:
    inputs:
      release_label:
        description: Artifact label (vX.Y.Z, latest, ci-<run>)
        required: true
        type: string
      app_version:
        description: MAJOR.MINOR.PATCH (default packaging/shared/version.txt)
        required: false
        type: string
        default: ""
      artifact_name:
        description: Name of the uploaded artifact holding dist/
        required: false
        type: string
        default: linux-release

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-24.04
    # Ubuntu 22.04 sets the floor: glibc 2.35 and GTK 4.6, so one build runs on
    # Ubuntu 22.04+, Debian 12+, Fedora, RHEL 9 family, openSUSE, Arch, Gentoo.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates curl xz-utils zstd file \
            libpulse-dev libsqlite3-dev libx11-dev libdbus-1-dev libgtk-4-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          app_version="${{ inputs.app_version }}"
          if [[ -z "${app_version}" ]]; then app_version="$(tr -d '[:space:]' < packaging/shared/version.txt)"; fi
          echo "APP_VERSION=${app_version}" >> "${GITHUB_ENV}"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Track master while Linux integration migrates to each current compiler change.
          version: master

      - name: Cache native runtimes (whisper.cpp, llama.cpp, ggml)
        id: native-cache
        uses: actions/cache@v6
        with:
          path: /opt/talkies-deps
          key: linux-native-ubuntu22.04-${{ hashFiles('packaging/linux/deps.env', 'packaging/linux/build-native-deps.sh') }}

      - name: Build native runtimes
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: /opt/talkies-deps
        run: packaging/linux/build-native-deps.sh

      - name: Install native runtimes
        run: |
          cp -a /opt/talkies-deps/. /usr/local/
          ldconfig

      - name: Cache pinned S1-mini model
        uses: actions/cache@v6
        with:
          path: ~/.local/share/talkies/models/s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          key: s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c-3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634

      - name: Cache pinned Whisper tiny model
        uses: actions/cache@v6
        with:
          path: ~/.local/share/talkies/models/ggml-tiny.bin
          key: whisper-tiny-5359861c739e955e79d9a303bcbc70fb988958b1-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21

      - name: Run tests (with local Whisper and S1-mini models)
        working-directory: linux
        env:
          TALKIES_TEST_S1_MINI: "1"
          TALKIES_TEST_WHISPER: "1"
        run: zig build test --summary all

      - name: Verify offline cached-model dictation acceptance
        working-directory: linux
        env:
          TALKIES_OFFLINE_ACCEPTANCE: "1"
        run: zig build test

      - name: Build release binaries
        working-directory: linux
        run: zig build -Doptimize=ReleaseSafe -Dversion="${APP_VERSION}"

      - name: Build packages (tar.gz, deb, rpm, Arch) and distro recipes
        env:
          VERSION: ${{ inputs.release_label }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: packaging/linux/package.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install-test:
    name: Install on ${{ matrix.image }} (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", mode: native }
          - { image: "ubuntu:24.04", mode: native }
          - { image: "debian:12", mode: native }
          - { image: "debian:13", mode: native }
          - { image: "fedora:42", mode: native }
          - { image: "almalinux:9", mode: native }
          - { image: "opensuse/tumbleweed", mode: native }
          - { image: "archlinux:latest", mode: native }
          - { image: "debian:12", mode: tar }
          - { image: "fedora:42", mode: tar }

    steps:
      - name: Checkout test script
        uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/linux/test-install.sh
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Install, run, and remove
        shell: bash
        run: bash packaging/linux/test-install.sh dist "${{ inputs.release_label }}" "${{ matrix.mode }}"

  aur-test:
    name: Build AUR package with makepkg
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: makepkg -si from the rendered PKGBUILD
        shell: bash
        env:
          LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^pkgver=//p' dist/PKGBUILD)"
          pacman -Sy --noconfirm --needed base-devel sudo >/dev/null
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir /build
          cp dist/PKGBUILD /build/
          # Pre-seed the source so makepkg verifies the pinned SHA-256 offline.
          cp "dist/Talkies-Linux-${LABEL}.tar.gz" "/build/talkies-${APP_VERSION}.tar.gz"
          chown -R builder /build
          cd /build
          sudo -u builder makepkg -si --noconfirm
          talkies --version
          test -f /usr/share/licenses/talkies-bin/LICENSE
