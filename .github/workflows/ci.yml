name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'packaging/macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'packaging/macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            macos:
              - 'mac/**'
              - 'packaging/macos/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            windows:
              - 'windows/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            linux:
              - 'linux/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-pages.yml'

  macos:
    name: macOS Build & Test
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: mac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('mac/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build macOS app
        working-directory: mac
        run: swift build --target Talkies

      - name: Run Swift package tests
        working-directory: mac
        run: swift test

      - name: Smoke-test distributable app bundle
        env:
          VERSION: 0.0.0
          OUTPUT_DIR: ${{ runner.temp }}/talkies-package
        run: packaging/macos/package-app.sh

      - name: Download pinned S1-mini and verify CPU cleanup
        working-directory: mac
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
        run: swift test --filter S1MiniCleanerIntegrationTests

      - name: Cache WhisperKit model files
        uses: actions/cache@v5
        with:
          path: ~/Documents/huggingface
          key: ${{ runner.os }}-whisperkit-tiny-${{ hashFiles('mac/Package.resolved') }}

      - name: Verify cached WhisperKit transcription with downloads disabled
        working-directory: mac
        env:
          TALKIES_RUN_WHISPERKIT_MODEL_TESTS: '1'
        run: swift test --filter WhisperKitRecognizerTests/testTranscribesWithCachedModelWhenDownloadsAreDisabled

  windows:
    name: Windows Build & Test
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet restore Talkies.Windows.Tests.csproj

      - name: Cache verified S1-mini model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          key: windows-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c-3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634

      - name: Cache verified Whisper tiny model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
          key: windows-whisper-tiny-5359861c739e955e79d9a303bcbc70fb988958b1-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21

      - name: Build Windows app
        working-directory: windows/Talkies.Windows
        run: dotnet build --configuration Debug --no-restore

      - name: Run Windows tests
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "Category!=ModelIntegration" --verbosity normal

      - name: Verify cached S1-mini cleanup works offline on CPU
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_S1_MINI_MODEL_DIR: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "Category=ModelIntegration" --verbosity normal

      - name: Verify cached Whisper ASR works offline on CPU
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_WHISPER_MODEL_DIR: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "FullyQualifiedName~WhisperAsrOfflineIntegrationTests" --verbosity normal

  frontend:
    name: Website Typecheck & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bunx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Build GitHub Pages export without backend secrets
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /talkies
          NEXT_PUBLIC_SITE_URL: https://4cecoder.github.io/talkies
        run: bun run build

      - name: Verify published routes and assets
        working-directory: frontend
        run: |
          touch out/.nojekyll
          bun run test:pages

  linux:
    name: Linux Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Track master while Linux integration migrates to each current compiler change.
          version: master

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libpulse-dev \
            libsqlite3-dev \
            libx11-dev \
            libdbus-1-dev \
            libgtk-4-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libharfbuzz-dev

      - name: Workaround Ubuntu multiarch include paths
        # linux/build.zig hardcodes Gentoo/Fedora-style /usr/lib64/<pkg>/include
        # paths (e.g. for glibconfig.h, graphene-config.h) that don't exist on
        # Debian/Ubuntu, which install those generated headers under
        # /usr/lib/<multiarch-triplet>/<pkg>/include instead. Symlinking
        # /usr/lib64 to the multiarch lib dir lets the hardcoded paths resolve.
        run: sudo ln -sf "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" /usr/lib64

      - name: Build pinned CPU-only llama.cpp
        run: |
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp fetch --depth=1 https://github.com/ggml-org/llama.cpp.git 53ed051ce5e8193652e449f43216ca3859454f49
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          cd /tmp/llama.cpp
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DGGML_METAL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --target llama -j2
          sudo cmake --install build
          sudo ldconfig

      - name: Build whisper.cpp
        # whisper.cpp is not packaged for Ubuntu/Debian; build and install it
        # from source per linux/docs/DEPENDENCIES.md and linux/SHIPPING.md.
        run: |
          git init /tmp/whisper.cpp
          git -C /tmp/whisper.cpp fetch --depth=1 https://github.com/ggml-org/whisper.cpp.git d09f61a708f3487afa956ff578e60eae5e7a233c
          git -C /tmp/whisper.cpp checkout --detach FETCH_HEAD
          cd /tmp/whisper.cpp
          make
          # whisper.cpp's CMake layout has shifted upstream: shared libs
          # (libwhisper.so + several libggml*.so backend libs) now land
          # under build/, not the repo root. Locate and install whatever
          # got produced instead of hardcoding a path that goes stale on
          # every upstream change.
          sudo find build -name 'lib*.so*' -exec cp -P {} /usr/local/lib/ \;
          sudo find . -name '*.h' -path '*/include/*' -exec cp {} /usr/local/include/ \;
          sudo ldconfig

      - name: Build
        working-directory: linux
        run: zig build

      - name: Cache pinned S1-mini model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/talkies/models/s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          key: s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c-3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634

      - name: Cache pinned Whisper tiny model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/talkies/models/ggml-tiny.bin
          key: whisper-tiny-5359861c739e955e79d9a303bcbc70fb988958b1-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21

      - name: Run tests
        working-directory: linux
        env:
          TALKIES_TEST_S1_MINI: "1"
          TALKIES_TEST_WHISPER: "1"
        run: zig build test
