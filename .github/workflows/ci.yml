name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'windows/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'windows/**'
      - '.github/workflows/ci.yml'

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            macos:
              - 'mac/**'
              - '.github/workflows/ci.yml'
            windows:
              - 'windows/**'
              - '.github/workflows/ci.yml'

  macos:
    name: macOS Build & Test
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.0'

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: mac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('mac/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build and test TalkiesCore library
        working-directory: mac
        run: |
          # ============================================================================
          # TEMPORARY WORKAROUND: Building TalkiesCore only (not full Talkies app)
          # ============================================================================
          #
          # REASON: WhisperKit (v0.15.0) does not fully support Swift 6 yet, causing
          # runtime crashes due to task isolation failures during model prewarming.
          #
          # UPSTREAM ISSUE: https://github.com/argmaxinc/WhisperKit/issues/315
          # - Status: Open (as of Dec 2024)
          # - Root cause: Runtime assertion failure due to task isolation (unsafe in Swift 6)
          # - Maintainer response: "Swift 6 is not yet officially supported, but any
          #   debug info you have from this crash would be helpful. We intend to support
          #   Swift 6 for the v1.0.0 version of this package."
          #
          # WHISPERKIT SWIFT 6 STATUS:
          # - v0.14.1 (Oct 2024): Initial Swift 6 concurrency work started
          # - v0.15.0 (Nov 2024): Latest release, still incomplete Swift 6 support
          # - Target: Full support planned for v1.0.0 (no ETA)
          #
          # WORKAROUND STRATEGY:
          # Create a minimal Package.swift that excludes WhisperKit dependency,
          # building only TalkiesCore library which contains core business logic
          # (no transcription service). This allows us to:
          # 1. Validate core Swift code quality and architecture
          # 2. Run unit tests for business logic
          # 3. Ensure Swift 6 strict concurrency compliance in our code
          #
          # TODO: Remove this workaround when WhisperKit v1.0.0 is released with
          # full Swift 6 support. Track upstream issue for updates.
          # ============================================================================

          cat > Package.swift << 'EOF'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "Talkies",
              platforms: [.macOS(.v15)],
              products: [.library(name: "TalkiesCore", targets: ["TalkiesCore"])],
              targets: [
                  .target(name: "TalkiesCore", dependencies: [], path: "Sources/TalkiesCore"),
                  .testTarget(name: "TalkiesCoreTests", dependencies: ["TalkiesCore"], path: "Tests/TalkiesCoreTests"),
              ]
          )
          EOF

          # Build the library in debug mode
          echo "Building TalkiesCore library..."
          swift build -c debug --target TalkiesCore

          # Run tests with proper error handling
          echo "Running TalkiesCore tests..."
          if xcodebuild test -scheme TalkiesCore -destination 'platform=macOS' -skipPackagePluginValidation 2>&1; then
            echo "Tests passed via xcodebuild"
          else
            echo "xcodebuild test failed, trying swift test..."
            if swift test --filter TalkiesCoreTests 2>&1; then
              echo "Tests passed via swift test"
            else
              echo "WARNING: Tests could not be executed. This may be due to XCTest framework issues with Swift 6 on GitHub Actions runners."
              echo "NOTE: Tests pass locally on macOS 15+ with Xcode 16+. CI environment limitations are known."
              exit 1
            fi
          fi

  windows:
    name: Windows Build & Test
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: windows/Talkies.Windows
        run: dotnet restore

      - name: Build Windows app
        working-directory: windows/Talkies.Windows
        run: dotnet build --configuration Debug --no-restore

      - name: Run Windows tests
        working-directory: windows/Talkies.Windows
        run: dotnet test --configuration Debug --no-build --verbosity normal
