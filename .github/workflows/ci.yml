name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'windows/**'
      - 'linux/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'windows/**'
      - 'linux/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            macos:
              - 'mac/**'
              - '.github/workflows/ci.yml'
            windows:
              - 'windows/**'
              - '.github/workflows/ci.yml'
            linux:
              - 'linux/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  macos:
    name: macOS Build & Test
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: mac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('mac/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build macOS app
        working-directory: mac
        run: swift build --target Talkies

      - name: Test TalkiesCore
        working-directory: mac
        run: |
          # TalkiesCore tests currently use a small standalone package manifest.
          # Build the actual app above before switching manifests for these tests.
          cat > Package.swift << 'EOF'
          // swift-tools-version: 6.3
          import PackageDescription
          let package = Package(
              name: "Talkies",
              platforms: [.macOS(.v15)],
              products: [.library(name: "TalkiesCore", targets: ["TalkiesCore"])],
              targets: [
                  .target(name: "TalkiesCore", dependencies: [], path: "Sources/TalkiesCore"),
                  .testTarget(name: "TalkiesCoreTests", dependencies: ["TalkiesCore"], path: "Tests/TalkiesCoreTests"),
              ]
          )
          EOF
          swift test --filter TalkiesCoreTests

  windows:
    name: Windows Build & Test
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: windows/Talkies.Windows
        run: dotnet restore

      - name: Build Windows app
        working-directory: windows/Talkies.Windows
        run: dotnet build --configuration Debug --no-restore

      - name: Run Windows tests
        working-directory: windows/Talkies.Windows
        run: dotnet test --configuration Debug --no-build --verbosity normal

  frontend:
    name: Website Typecheck & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bunx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: bun run lint

  linux:
    name: Linux Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Track Zig master intentionally (bleeding edge, not the 0.16
          # stable release) — a fixed dev-nightly commit gets pruned from
          # the build mirrors within weeks and starts hard-failing CI.
          version: master

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libpulse-dev \
            libsqlite3-dev \
            libx11-dev \
            libdbus-1-dev \
            libgtk-4-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libharfbuzz-dev

      - name: Workaround Ubuntu multiarch include paths
        # linux/build.zig hardcodes Gentoo/Fedora-style /usr/lib64/<pkg>/include
        # paths (e.g. for glibconfig.h, graphene-config.h) that don't exist on
        # Debian/Ubuntu, which install those generated headers under
        # /usr/lib/<multiarch-triplet>/<pkg>/include instead. Symlinking
        # /usr/lib64 to the multiarch lib dir lets the hardcoded paths resolve.
        run: sudo ln -sf "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" /usr/lib64

      - name: Build whisper.cpp
        # whisper.cpp is not packaged for Ubuntu/Debian; build and install it
        # from source per linux/docs/DEPENDENCIES.md and linux/SHIPPING.md.
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          make
          # whisper.cpp's CMake layout has shifted upstream: shared libs
          # (libwhisper.so + several libggml*.so backend libs) now land
          # under build/, not the repo root. Locate and install whatever
          # got produced instead of hardcoding a path that goes stale on
          # every upstream change.
          sudo find build -name 'lib*.so*' -exec cp -P {} /usr/local/lib/ \;
          sudo find . -name '*.h' -path '*/include/*' -exec cp {} /usr/local/include/ \;
          sudo ldconfig

      - name: Build
        working-directory: linux
        run: zig build

      - name: Run tests
        working-directory: linux
        run: zig build test
