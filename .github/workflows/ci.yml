name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'packaging/macos/**'
      - 'windows/**'
      - 'packaging/windows/**'
      - 'linux/**'
      - 'packaging/linux/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-package.yml'
      - 'tests/fixtures/intents/**'
      - 'tests/fixtures/agents/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'mac/**'
      - 'packaging/macos/**'
      - 'windows/**'
      - 'packaging/windows/**'
      - 'linux/**'
      - 'packaging/linux/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-package.yml'
      - 'tests/fixtures/intents/**'
      - 'tests/fixtures/agents/**'

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            macos:
              - 'mac/**'
              - 'packaging/macos/**'
              - 'tests/fixtures/intents/**'
              - 'tests/fixtures/agents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            windows:
              - 'windows/**'
              - 'packaging/windows/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            linux:
              - 'linux/**'
              - 'packaging/linux/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/linux-package.yml'
            workflows:
              - '.github/workflows/**'

  workflow-validation:
    name: GitHub Actions Workflow Validation
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint CI, release, and Android workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/linux-package.yml .github/workflows/android-ci.yml

  macos:
    name: macOS Build & Test
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: mac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('mac/Package.swift', 'mac/Packages/TalkiesConnectors/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build macOS app
        working-directory: mac
        run: swift build --target Talkies

      - name: Run Swift package tests
        working-directory: mac
        run: swift test

      - name: Smoke-test distributable app bundle
        env:
          VERSION: 0.0.0
          OUTPUT_DIR: ${{ runner.temp }}/talkies-package
        run: packaging/macos/package-app.sh

      - name: Smoke-test macOS DMG installer
        env:
          APP_BUNDLE: ${{ runner.temp }}/talkies-package/Talkies.app
          RELEASE_LABEL: ci-${{ github.run_id }}
          OUTPUT_DIR: ${{ runner.temp }}/talkies-dmg
        run: packaging/macos/package-dmg.sh

      - name: Download pinned S1-mini and verify CPU cleanup
        working-directory: mac
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
        run: swift test --filter S1MiniCleanerIntegrationTests

      - name: Cache WhisperKit model files
        uses: actions/cache@v6
        with:
          path: ~/Documents/huggingface
          key: ${{ runner.os }}-whisperkit-tiny-${{ hashFiles('mac/Package.resolved') }}

      - name: Provision WhisperKit tiny and verify transcription
        working-directory: mac
        env:
          TALKIES_RUN_WHISPERKIT_MODEL_TESTS: '1'
        run: swift test --filter WhisperKitRecognizerTests/testTranscribesWithCachedModelWithoutResolvingItRemotely

      - name: Verify cached ASR, denied-network S1-mini cleanup, and insertion acceptance
        working-directory: mac
        env:
          TALKIES_RUN_OFFLINE_ACCEPTANCE: '1'
        run: swift test --filter OfflineDictationAcceptanceTests

  windows:
    name: Windows Build & Test
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet restore Talkies.Windows.Tests.csproj

      - name: Cache verified S1-mini model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          key: windows-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c-3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634

      - name: Cache verified Whisper tiny model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
          key: windows-whisper-tiny-5359861c739e955e79d9a303bcbc70fb988958b1-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21

      - name: Build Windows app
        working-directory: windows/Talkies.Windows
        run: dotnet build --configuration Debug --no-restore

      - name: Run Windows tests
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "Category!=ModelIntegration" --verbosity normal

      # Release publishes self-contained artifacts with different compiler and
      # trimming settings. Validate that configuration on PRs as well as in
      # the post-merge release workflow.
      - name: Build Windows app (Release)
        working-directory: windows/Talkies.Windows
        run: dotnet build --configuration Release --no-restore

      - name: Run Windows tests (Release)
        working-directory: windows/Talkies.Windows.Tests
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Release --no-restore --filter "Category!=ModelIntegration" --verbosity normal

      - name: Verify cached S1-mini cleanup works offline on CPU
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_S1_MINI_MODEL_DIR: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "Category=ModelIntegration" --verbosity normal

      - name: Verify cached Whisper ASR works offline on CPU
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_WHISPER_MODEL_DIR: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "FullyQualifiedName~WhisperAsrOfflineIntegrationTests" --verbosity normal

      - name: Verify cached ASR, denied-network S1-mini cleanup, and insertion boundary
        working-directory: windows/Talkies.Windows.Tests
        env:
          TALKIES_RUN_MODEL_TESTS: '1'
          TALKIES_TEST_S1_MINI_MODEL_DIR: ${{ runner.temp }}/talkies-s1-mini-34add00a48a2e5d24e5a4ee5405a99620a3a240c
          TALKIES_TEST_WHISPER_MODEL_DIR: ${{ runner.temp }}/talkies-whisper-5359861c739e955e79d9a303bcbc70fb988958b1
        run: dotnet test Talkies.Windows.Tests.csproj --configuration Debug --no-restore --filter "FullyQualifiedName~OfflineDictationAcceptanceTests" --verbosity normal

      - name: Set up verified NSIS compiler
        shell: pwsh
        run: ./packaging/windows/setup-nsis.ps1

      - name: Smoke-test self-contained Windows release archive
        env:
          APP_VERSION: 0.0.0
          RELEASE_LABEL: ci-${{ github.run_id }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/talkies-windows-package
        run: |
          $settingsMarker = Join-Path $env:USERPROFILE '.talkies/ci-preservation-check'
          $modelMarker = Join-Path $env:LOCALAPPDATA 'Talkies/Models/ci-preservation-check'
          New-Item -ItemType Directory -Force -Path (Split-Path $settingsMarker), (Split-Path $modelMarker) | Out-Null
          Set-Content -Path $settingsMarker -Value 'preserve-settings'
          Set-Content -Path $modelMarker -Value 'preserve-model'
          ./packaging/windows/package-portable.ps1 -AppVersion "$env:APP_VERSION" -ReleaseLabel "$env:RELEASE_LABEL" -OutputDirectory "$env:OUTPUT_DIRECTORY"
          if ((Get-Content -Raw $settingsMarker).Trim() -ne 'preserve-settings') { throw 'Uninstall did not preserve user settings.' }
          if ((Get-Content -Raw $modelMarker).Trim() -ne 'preserve-model') { throw 'Uninstall did not preserve downloaded models.' }
          Remove-Item $settingsMarker, $modelMarker -Force

  linux:
    name: Linux Build, Package & Install Tests
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    uses: ./.github/workflows/linux-package.yml
    with:
      release_label: ci-${{ github.run_id }}
      artifact_name: linux-ci-packages
