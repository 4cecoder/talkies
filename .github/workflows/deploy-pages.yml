name: Deploy Talkies Website to GitHub Pages

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout website source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint website
        run: bun run lint

      - name: Build static GitHub Pages export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /talkies
          NEXT_PUBLIC_SITE_URL: https://4cecoder.github.io/talkies
        run: bun run build

      - name: Preserve Next.js asset folders
        run: touch out/.nojekyll

      - name: Verify Pages export
        run: bun run test:pages

      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: out/
          force_orphan: true
          commit_message: "Deploy website from ${{ github.sha }}"
