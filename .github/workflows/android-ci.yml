name: Android Kotlin CI

on:
  push:
    branches: [master]
    paths:
      - 'mobile/android/**'
      - 'tests/fixtures/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mobile/android/**'
      - 'tests/fixtures/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test native Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build release APK and run release unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest
      - name: Verify APKs contain the local runtime and license, not model weights
        shell: bash
        run: |
          set -euo pipefail
          for apk in mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk; do
            for abi in arm64-v8a x86_64; do
              unzip -l "$apk" | grep -F "lib/$abi/libtalkies_whisper.so"
            done
            unzip -l "$apk" | grep -F 'assets/licenses/whisper.cpp-LICENSE.txt'
            if unzip -l "$apk" | grep -F 'ggml-tiny.bin'; then
              echo 'Whisper weights must stay in app-private model storage, outside the APK.' >&2
              exit 1
            fi
          done
      - name: Run unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload tested debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Talkies-Android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Cache pinned Whisper tiny model for offline Android acceptance
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/talkies-android-ggml-tiny.bin
          key: android-whisper-tiny-5359861c739e955e79d9a303bcbc70fb988958b1-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
      - name: Download and verify pinned Android ASR model
        shell: bash
        env:
          MODEL_PATH: ${{ runner.temp }}/talkies-android-ggml-tiny.bin
        run: |
          set -euo pipefail
          if [[ ! -f "$MODEL_PATH" ]]; then
            curl --fail --location --retry 3 \
              'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny.bin?download=true' \
              --output "$MODEL_PATH"
          fi
          test "$(stat -c '%s' "$MODEL_PATH")" = '77691713'
          echo 'be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  '"$MODEL_PATH" | sha256sum --check
      - name: Enable KVM for Android emulator
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 0666 /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo 'KVM is available for the Android emulator.'
          else
            echo 'KVM is unavailable on this runner; the emulator action will use its automatic fallback.'
          fi
      - name: Run real Whisper transcription in airplane mode on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          working-directory: mobile/android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb push "$RUNNER_TEMP/talkies-android-ggml-tiny.bin" /data/local/tmp/ggml-tiny.bin
            adb push ../../tests/fixtures/jfk.wav /data/local/tmp/jfk.wav
            adb shell run-as com.talkies.android mkdir -p files/models files/fixtures
            adb shell run-as com.talkies.android cp /data/local/tmp/ggml-tiny.bin files/models/ggml-tiny.bin
            adb shell run-as com.talkies.android cp /data/local/tmp/jfk.wav files/fixtures/jfk.wav
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew --no-daemon connectedDebugAndroidTest
