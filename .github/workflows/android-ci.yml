name: Android Kotlin CI

on:
  push:
    branches: [master]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test native Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Run unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload tested debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Talkies-Android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
