# Talkies - Hyprland integration (Hyprland >= 0.53 windowrule syntax)
#
# The daemon applies the HUD rules below automatically at startup via
# `hyprctl keyword`; copy them into hyprland.conf only if you prefer static rules.

windowrule = match:title ^(Talkies Dictation)$, float true
windowrule = match:title ^(Talkies Dictation)$, pin true
windowrule = match:title ^(Talkies Dictation)$, no_focus true
windowrule = match:title ^(Talkies Dictation)$, no_initial_focus true
windowrule = match:title ^(Talkies Dictation)$, border_size 0
windowrule = match:title ^(Talkies Dictation)$, no_shadow true
windowrule = match:title ^(Talkies Dictation)$, no_anim true
# The window is a fixed 624x476 transparent surface; the panel inside draws
# its own glass and springs between the pill and the full panel.
windowrule = match:title ^(Talkies Dictation)$, no_blur true
windowrule = match:title ^(Talkies Dictation)$, no_dim true
windowrule = match:title ^(Talkies Dictation)$, opacity 1.0 override 1.0 override
# Top centre, 34px under the top of the screen; the daemon adds your top
# bar's reserved height (59 here is an example: 26 + a 33px bar).
windowrule = match:title ^(Talkies Dictation)$, move ((monitor_w-624)/2) (59)

# Settings is a compact floating dialog, not a tiled pane
windowrule = match:title ^(Talkies Settings)$, float true
windowrule = match:title ^(Talkies Settings)$, size 680 560
windowrule = match:title ^(Talkies Settings)$, center true

# Hotkey: Right Alt works automatically when your user is in the `input` group.
# Otherwise, forward a compositor binding (hold for push-to-talk, tap to toggle):
bind = , Alt_R, exec, ~/path/to/talkies/linux/scripts/talkies-hotkey.sh down
bindr = ALT, Alt_R, exec, ~/path/to/talkies/linux/scripts/talkies-hotkey.sh up

# Alternative: a plain toggle on any chord
# bind = SUPER ALT, T, exec, ~/path/to/talkies/linux/scripts/talkies-hotkey.sh toggle
