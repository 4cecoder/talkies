# Talkies Overlay - Hyprland Window Rules
# Add this to your ~/.config/hypr/hyprland.conf

# Make overlay float and remove borders
windowrulev2 = float, title:(Talkies Recording Overlay)
windowrulev2 = noborder, title:(Talkies Recording Overlay)
windowrulev2 = noanim, title:(Talkies Recording Overlay)
windowrulev2 = nofocus, title:(Talkies Recording Overlay)
windowrulev2 = noshadow, title:(Talkies Recording Overlay)

# Alternative using app_id (if the above doesn't work)
# windowrulev2 = float, class:(talkies-overlay)
# windowrulev2 = noborder, class:(talkies-overlay)
# windowrulev2 = noanim, class:(talkies-overlay)

# Position overlay at top center of screen
windowrulev2 = move 50% 2%, title:(Talkies Recording Overlay)
windowrulev2 = center, title:(Talkies Recording Overlay)
