  <g class="ColorScheme-Text" style="fill:currentColor;fill-rule:evenodd">
    <rect x="4.5" y="1" width="7" height="1.4" rx="0.7"/>
    <rect x="7.3" y="1.5" width="1.4" height="13"/>
    <rect x="4.5" y="13.6" width="7" height="1.4" rx="0.7"/>
  </g>
</svg>
