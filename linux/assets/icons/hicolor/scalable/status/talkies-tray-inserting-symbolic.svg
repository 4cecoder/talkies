<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- macOS: text.cursor (inserting text). KDE recolors .ColorScheme-Text to the panel's text color; GTK recolors -symbolic icons. -->
