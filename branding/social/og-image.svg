<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a1f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowRadial" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Glow effect -->
  <ellipse cx="600" cy="315" rx="400" ry="300" fill="url(#glowRadial)" opacity="0.6"/>

  <!-- Logo (centered, larger) -->
  <g transform="translate(420, 120)">
    <!-- Glow -->
    <ellipse cx="180" cy="140" rx="120" ry="160" fill="url(#glowRadial)" filter="blur(30px)" opacity="0.8"/>

    <!-- Microphone body -->
    <rect x="130" y="50" width="100" height="180" rx="50" fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="4"/>

    <!-- Microphone grille lines -->
    <line x1="150" y1="90" x2="210" y2="90" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="150" y1="115" x2="210" y2="115" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="150" y1="140" x2="210" y2="140" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="150" y1="165" x2="210" y2="165" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="150" y1="190" x2="210" y2="190" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round"/>

    <!-- Microphone stand -->
    <path d="M 180 230 L 180 270 M 130 270 L 230 270 M 154 270 L 154 330 M 206 330 L 154 330"
          stroke="url(#logoGradient)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Sound waves -->
    <path d="M 264 100 Q 284 100 284 120 Q 284 140 264 140"
          stroke="url(#logoGradient)"
          stroke-width="8"
          stroke-linecap="round"
          fill="none"
          opacity="0.7"/>
    <path d="M 294 80 Q 324 80 324 120 Q 324 160 294 160"
          stroke="url(#logoGradient)"
          stroke-width="8"
          stroke-linecap="round"
          fill="none"
          opacity="0.5"/>

    <path d="M 96 100 Q 76 100 76 120 Q 76 140 96 140"
          stroke="url(#logoGradient)"
          stroke-width="8"
          stroke-linecap="round"
          fill="none"
          opacity="0.7"/>
    <path d="M 66 80 Q 36 80 36 120 Q 36 160 66 160"
          stroke="url(#logoGradient)"
          stroke-width="8"
          stroke-linecap="round"
          fill="none"
          opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">
    Talkies
  </text>

  <!-- Subtitle -->
  <text x="600" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle">
    Voice-Powered Writing Assistant
  </text>

  <!-- Badge/Tagline -->
  <rect x="480" y="550" width="240" height="50" rx="25" fill="url(#logoGradient)" opacity="0.2"/>
  <text x="600" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="url(#logoGradient)" text-anchor="middle">
    Write 3x Faster
  </text>
</svg>
