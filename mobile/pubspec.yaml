name: talkies_mobile
description: A mobile voice transcription application combining the best features from macOS and Windows versions
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Audio Recording & Transcription
  record: ^5.2.0  # Cross-platform audio recording (v5 with improved Android namespace support and MediaCodec)
  path_provider: ^2.1.0  # File system paths
  permission_handler: ^11.0.0  # Microphone permissions
  
  # State Management
  provider: ^6.1.0
  
  # Storage
  shared_preferences: ^2.2.0  # Settings persistence
  
  # File handling
  file_picker: ^6.0.0  # For export functionality
  share_plus: ^7.2.0  # For sharing transcripts
  
  # HTTP client for LLM integration
  http: ^1.1.0
  dio: ^5.4.0
  
  # JSON
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - assets/images/
