[project]
name = "whisper-cli"
version = "0.2.0"
description = "Real-time voice transcription with blazing-fast VTT generation optimized for Apple Silicon"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "click>=8.0.0",
    "faster-whisper>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "groq>=0.4.0",
    "pytube>=15.0.0",
    "watchdog>=3.0.0",
    "pyaudio>=0.2.0",
    "requests>=2.31.0",
    "toml>=0.10.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "sounddevice>=0.4.0",
    "numpy>=1.21.0",
    "textual>=0.47.0",
    "webrtcvad>=2.0.0",
    "pynput>=1.7.0",
    "pyperclip>=1.8.0",
    "mlx-whisper>=0.3.0",
    "pyqt6>=6.6.0",
]

requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
whisper-cli = "whisper_cli.cli:main"
whisper-tui = "whisper_cli.tui:run_tui"
talkies = "whisper_cli.tui:run_tui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_cli"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.1",
]
