# One spec for the .deb, .rpm and Arch packages. package.sh runs nfpm from a
# work directory holding the stage.sh tree (root/) and the scripts/ below.
name: talkies
arch: amd64
platform: linux
version: ${APP_VERSION}
release: 1
section: sound
priority: optional
maintainer: Talkies contributors <opensource@talkies.app>
vendor: Talkies
homepage: https://github.com/4cecoder/talkies
license: MIT
description: |-
  Private, on-device voice dictation.
  Hold Right Alt, speak, and release: Talkies transcribes speech locally with
  Whisper and types the text into the focused app. Works on X11 and Wayland,
  with a tray item, floating indicator, and optional local LLM cleanup.

contents:
  - src: root/usr/
    dst: /usr/
    type: tree

scripts:
  postinstall: scripts/postinstall.sh
  postremove: scripts/postremove.sh

# Runtime libraries only; whisper.cpp/llama.cpp/ggml ship inside the package.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgtk-4-1
      - libpulse0
      - libsqlite3-0
      - libx11-6
      - libdbus-1-3
      - libgomp1
      - libstdc++6
      - curl
    recommends:
      - wl-clipboard | xclip
      - pipewire-pulse | pulseaudio
  rpm:
    # Shared-library capabilities resolve on Fedora, RHEL-family and openSUSE alike.
    depends:
      - libgtk-4.so.1()(64bit)
      - libpulse.so.0()(64bit)
      - libpulse-simple.so.0()(64bit)
      - libsqlite3.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libdbus-1.so.3()(64bit)
      - libgomp.so.1()(64bit)
      - libstdc++.so.6()(64bit)
      - curl
    recommends:
      - wl-clipboard
      - xclip
  archlinux:
    depends:
      - gtk4
      - libpulse
      - sqlite
      - libx11
      - dbus
      - gcc-libs
      - curl

deb:
  fields:
    Bugs: https://github.com/4cecoder/talkies/issues

rpm:
  group: Applications/Multimedia
  summary: Private, on-device voice dictation
  compression: zstd

archlinux:
  packager: Talkies contributors <opensource@talkies.app>
